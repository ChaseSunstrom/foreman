# Foreman: Claude Code OpenTelemetry -> telegraf -> InfluxDB (append to your telegraf config; review first).
# Claude Code pushes OTLP/gRPC; one listener serves every concurrent session (unlike the Prometheus
# exporter, whose fixed port collides when two sessions run).

[[inputs.opentelemetry]]
  ## Where Claude Code sends OTLP (OTEL_EXPORTER_OTLP_ENDPOINT=http://<this-host>:4317)
  service_address = "0.0.0.0:4317"
  ## Measurement "prometheus", one field per metric (claude_code_cost_usage, claude_code_token_usage, ...)
  metrics_schema = "prometheus-v2"
  ## Tag the data so it can go to its own bucket
  [inputs.opentelemetry.tags]
    source = "claude-code"

## Route to a dedicated bucket with your existing influxdb_v2 output, e.g.:
# [[outputs.influxdb_v2]]
#   urls = ["http://127.0.0.1:8086"]
#   token = "$INFLUX_TOKEN"
#   organization = "home"
#   bucket = "claude"
#   [outputs.influxdb_v2.tagpass]
#     source = ["claude-code"]
