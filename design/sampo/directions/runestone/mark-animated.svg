<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
<title id="t">Sampo: the rune millstone turns, its runes light in order, sparks leave the rim</title>
<style>
.stone{transform-origin:32px 32px;animation:turn 4s cubic-bezier(0.25,0.1,0.25,1) both}
.eye{animation:heat 3s ease-in both}
.r1{animation:lite 240ms ease-out 1.2s both}
.r2{animation:lite 240ms ease-out 1.44s both}
.r3{animation:lite 240ms ease-out 1.68s both}
.r4{animation:lite 240ms ease-out 1.92s both}
.r5{animation:lite 240ms ease-out 2.16s both}
.r6{animation:lite 240ms ease-out 2.4s both}
.r7{animation:lite 240ms ease-out 2.64s both}
.r8{animation:lite 240ms ease-out 2.88s both}
.k>*{opacity:0}
.k1{animation:k1 900ms ease-out 3.4s both}
.k2{animation:k2 900ms ease-out 3.55s both}
.k3{animation:k3 900ms ease-out 3.7s both}
@keyframes turn{from{transform:rotate(-135deg)}to{transform:rotate(0deg)}}
@keyframes heat{from{opacity:0.3}to{opacity:1}}
@keyframes lite{from{opacity:0.15}to{opacity:1}}
@keyframes k1{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translate(6px,-5px)}}
@keyframes k2{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translate(-6px,4px)}}
@keyframes k3{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translate(4px,5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="eye" cx="32" cy="32" r="6.5" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#FFE3A8"/><stop offset="0.55" stop-color="#FF9E3D"/><stop offset="1" stop-color="#E0601F"/>
</radialGradient>
</defs>
<circle cx="32" cy="32" r="30" fill="#16181C" stroke="#B07A3B" stroke-width="2"/>
<g class="stone" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="32" cy="32" r="19" stroke="#3A3F48"/>
<path stroke="#2E333B" stroke-width="1.8" d="M36.5 39.21L36.5 48.91M30.08 40.28L23.22 47.14M24.79 36.5L15.09 36.5M23.72 30.08L16.86 23.22M27.5 24.79L27.5 15.09M33.92 23.72L40.78 16.86M39.21 27.5L48.91 27.5M40.28 33.92L47.14 40.78"/>
<g stroke="#FF9E3D" stroke-width="1.4">
<path class="r1" transform="rotate(22.5 32 32)" d="M32 5V11M32 7.5L34.2 5.3"/>
<path class="r2" transform="rotate(67.5 32 32)" d="M32 5V11M32 9.5L29.8 7.3"/>
<path class="r3" transform="rotate(112.5 32 32)" d="M32 5V11M29.8 9L34.2 6.6"/>
<path class="r4" transform="rotate(157.5 32 32)" d="M32 5V11M32 5.4L34.2 7L32 8.6"/>
<path class="r5" transform="rotate(202.5 32 32)" d="M30.5 5V11M33.5 5V11M30.5 6.5L33.5 9.5"/>
<path class="r6" transform="rotate(247.5 32 32)" d="M32 5V11M32 7.2L34.2 5M32 9.6L34.2 7.4"/>
<path class="r7" transform="rotate(292.5 32 32)" d="M32 5V11M32 6.6H34.3M32 9.4H29.7"/>
<path class="r8" transform="rotate(337.5 32 32)" d="M32 5V11M29.9 6.8Q32 10 34.1 6.8"/>
</g>
</g>
<circle class="eye" cx="32" cy="32" r="6.5" fill="url(#eye)"/>
<g class="stone" fill="#16181C">
<rect x="25.5" y="31" width="13" height="2" rx="1"/>
<circle cx="32" cy="32" r="1.8"/>
</g>
<g class="k" fill="#E0601F">
<circle class="k1" cx="55" cy="17" r="1.2"/>
<circle class="k2" cx="8" cy="44" r="1.2"/>
<circle class="k3" cx="44" cy="57" r="1"/>
</g>
</svg>
