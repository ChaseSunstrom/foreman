<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
<title id="t">Sampo: the orrery gear winds, its three mills come round into place and the forge sun flares</title>
<style>
.gear{transform-origin:32px 32px;animation:gear 4s cubic-bezier(0.45,0,0.2,1) both}
.o1,.o2,.o3{transform-origin:32px 32px}
.o1{animation:o1 4s cubic-bezier(0.45,0,0.2,1) both}
.o2{animation:o2 4s cubic-bezier(0.45,0,0.2,1) both}
.o3{animation:o3 4s cubic-bezier(0.45,0,0.2,1) both}
.l1{animation:lite 300ms ease-out 0.4s both}
.l2{animation:lite 300ms ease-out 0.7s both}
.l3{animation:lite 300ms ease-out 1s both}
.flare{opacity:0;transform-origin:32px 32px;animation:flare 1s ease-out 3.8s both}
@keyframes gear{from{transform:rotate(45deg)}to{transform:rotate(0deg)}}
@keyframes o1{from{transform:rotate(-360deg)}to{transform:rotate(0deg)}}
@keyframes o2{from{transform:rotate(-240deg)}to{transform:rotate(0deg)}}
@keyframes o3{from{transform:rotate(-120deg)}to{transform:rotate(0deg)}}
@keyframes lite{from{opacity:0.25}to{opacity:1}}
@keyframes flare{0%{opacity:0;transform:scale(0.6)}30%{opacity:0.9}100%{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
