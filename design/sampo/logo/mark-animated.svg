<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
<title id="t">Sampo: the rune millstone makes a turn and a quarter and settles, its runes light in order, sparks leave the rim</title>
<style>
.stone{transform-origin:32px 32px;animation:turn 4.2s cubic-bezier(0.25,0.1,0.25,1) both}
.eye{animation:heat 3s ease-in both}
.r1{animation:lite 240ms ease-out 1.2s both}
.r2{animation:lite 240ms ease-out 1.44s both}
.r3{animation:lite 240ms ease-out 1.68s both}
.r4{animation:lite 240ms ease-out 1.92s both}
.r5{animation:lite 240ms ease-out 2.16s both}
.r6{animation:lite 240ms ease-out 2.4s both}
.r7{animation:lite 240ms ease-out 2.64s both}
.r8{animation:lite 240ms ease-out 2.88s both}
.k>*{opacity:0}
.k1{animation:k1 900ms ease-out 2.9s both}
.k2{animation:k2 900ms ease-out 3s both}
.k3{animation:k3 900ms ease-out 3.1s both}
@keyframes turn{from{transform:rotate(-450deg)}to{transform:rotate(0deg)}}
@keyframes heat{from{opacity:0.3}to{opacity:1}}
@keyframes lite{from{opacity:0.15}to{opacity:1}}
@keyframes k1{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translate(6.5px,-5px)}}
@keyframes k2{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translate(7px,-3.5px)}}
@keyframes k3{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translate(5px,-6.5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><radialGradient id="eye" cx="32" cy="32" r="6.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE3A8"/><stop offset="0.55" stop-color="#FF9E3D"/><stop offset="1" stop-color="#E0601F"/></radialGradient></defs>
<circle id="disc" cx="32" cy="32" r="30" fill="#16181C" stroke="#B07A3B" stroke-width="2"/>
<g class="stone" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="32" cy="32" r="19" stroke="#3A3F48"/>
<path id="furrows" stroke="#4A5160" stroke-width="1.5" d="M32 23.4Q31.78 17.67 42.71 18.29M38.68 21.27Q41.72 20.82 47.14 23.43M38.08 25.92Q41.98 21.71 49.27 29.88M44.31 29.13Q46.78 30.97 48.77 36.65M40.6 32Q46.33 31.78 45.71 42.71M42.73 38.68Q43.18 41.72 40.57 47.14M38.08 38.08Q42.29 41.98 34.12 49.27M34.87 44.31Q33.03 46.78 27.35 48.77M32 40.6Q32.22 46.33 21.29 45.71M25.32 42.73Q22.28 43.18 16.86 40.57M25.92 38.08Q22.02 42.29 14.73 34.12M19.69 34.87Q17.22 33.03 15.23 27.35M23.4 32Q17.67 32.22 18.29 21.29M21.27 25.32Q20.82 22.28 23.43 16.86M25.92 25.92Q21.71 22.02 29.88 14.73M29.13 19.69Q30.97 17.22 36.65 15.23"/>
<g id="runes" stroke="#FF9E3D" stroke-width="1.4"><path class="r1" transform="rotate(22.5 32 32)" d="M32 5V11M32 8.6L34.4 6.2"/><path class="r2" transform="rotate(67.5 32 32)" d="M32 5V11M32 5.2L34 7M32 10.8L30 9"/><path class="r3" transform="rotate(112.5 32 32)" d="M32 5V11M30.5 8.9L33.5 7.1"/><path class="r4" transform="rotate(157.5 32 32)" d="M32 5V11M32 6.6L33.7 8L32 9.4"/><path class="r5" transform="rotate(202.5 32 32)" d="M32 5V11M34.4 5.4L32 7.4L34.4 9.4"/><path class="r6" transform="rotate(247.5 32 32)" d="M32 5V11M29.6 6.2H34.4M32 10.6L34.2 8.8"/><path class="r7" transform="rotate(292.5 32 32)" d="M32 5V11"/><path class="r8" transform="rotate(337.5 32 32)" d="M32 5V11M29.8 7L32 5.4L34.2 7M29.8 9.6L32 8L34.2 9.6"/></g>
</g>
<circle id="eye-core" class="eye" cx="32" cy="32" r="6.5" fill="url(#eye)"/>
<rect class="stone" x="25.5" y="31" width="13" height="2" rx="1" fill="#16181C"/>
<g class="k" fill="#E0601F"><circle class="k1" cx="13.53" cy="8.36" r="2"/><circle class="k2" cx="18.85" cy="5.04" r="2"/><circle class="k3" cx="9.02" cy="12.72" r="2"/></g>
</svg>
