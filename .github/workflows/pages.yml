name: pages

# The site at https://chasesunstrom.github.io/foreman/: site/ as is, plus the recorded demo from demo/.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "demo/live.mp4", "demo/demo.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/demo
          cp -r site/. _site/
          cp demo/live.mp4 demo/demo.svg _site/demo/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
