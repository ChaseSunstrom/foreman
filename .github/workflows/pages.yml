name: pages

# The site at https://chasesunstrom.github.io/foreman/: site/ as is, plus the recorded demo from demo/.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "demo/live.mp4", "demo/demo.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

# The build job runs the repo's code with read-only access; only the deploy job holds the pages and OIDC write tokens.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build the site
        run: python3 site/build.py _site  # site/ plus demo/live.mp4 and demo/demo.svg, and the feature pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5 (reads the Pages settings: needs the pages token)
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
