name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
        include:
          - os: macos-latest  # green since 1.2.44 (T-1284); still reported, not blocking, while it settles
            python: "3.14"
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: ${{ matrix.experimental && 35 || 20 }}  # macOS's full run took 21.4 min (1285 s of tests)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for the tests' commits
        run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - name: suite (no claude needed; the e2e roundtrip and hook bench stay local)
        run: python3 plugin/tests/run.py
