name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
        include:
          - os: macos-latest  # green since 1.2.44 (T-1284); still reported, not blocking, while it settles
            python: "3.14"
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: ${{ matrix.experimental && 35 || 20 }}  # macOS's full run took 21.4 min (1285 s of tests)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for the tests' commits
        run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - name: suite (no claude needed; the e2e roundtrip and hook bench stay local)
        run: python3 plugin/tests/run.py
        env:
          FOREMAN_CHROME: none  # the runner's chromium crashes under the parallel suite; local gates run the browser tests
