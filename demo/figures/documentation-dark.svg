<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img" aria-label="Documentation: a table of 5 rows (Doc, What&#x27;s in it); its text follows">
<title>Documentation: a table of 5 rows (Doc, What&#x27;s in it); its text follows</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#B4BDCE}.i{fill:#E8ECF4}.m{fill:#8893A7}.b{font-weight:600;fill:#E8ECF4}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7AA2FF}.l{fill:#7AA2FF}</style>
<rect x="0.5" y="0.5" width="879" height="295" rx="12" fill="#131822" stroke="#FFFFFF" stroke-opacity=".12"/>
<path d="M0.5 40V12.5A12 12 0 0 1 12.5 0.5H867.5A12 12 0 0 1 879.5 12.5V40Z" fill="#10141C"/>
<line x1="0.5" y1="40" x2="879.5" y2="40" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="16" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em">DOC</text>
<text x="176.1" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em">WHAT&#x27;S IN IT</text>
<text x="16" y="68" font-size="14" xml:space="preserve"><tspan class="c">MASTER.md</tspan></text>
<text x="176.1" y="68" font-size="14" xml:space="preserve">The system map: how to prompt it, every file, how the parts interact, operations and limitations. Start</text>
<text x="176.1" y="89" font-size="14" xml:space="preserve">here.</text>
<line x1="16" y1="108" x2="864" y2="108" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="136" font-size="14" xml:space="preserve"><tspan class="c">INSTALL.md</tspan></text>
<text x="176.1" y="136" font-size="14" xml:space="preserve">Installation steps written for an agent to follow, asking before each change.</text>
<line x1="16" y1="155" x2="864" y2="155" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="183" font-size="14" xml:space="preserve"><tspan class="c">CHANGELOG.md</tspan></text>
<text x="176.1" y="183" font-size="14" xml:space="preserve">Release notes.</text>
<line x1="16" y1="202" x2="864" y2="202" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="230" font-size="14" xml:space="preserve"><tspan class="c">BUILD_PROMPT.md</tspan></text>
<text x="176.1" y="230" font-size="14" xml:space="preserve">The spec Sampo was built from, including the plugin choices (§4.6 and Appendix A).</text>
<line x1="16" y1="249" x2="864" y2="249" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="277" font-size="14" xml:space="preserve"><tspan class="l">The site</tspan></text>
<text x="176.1" y="277" font-size="14" xml:space="preserve">A page per feature, with recorded runs.</text>
