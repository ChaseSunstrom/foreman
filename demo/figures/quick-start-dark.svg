<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 265" width="880" height="265" role="img" aria-label="Quick start: a table of 3 rows (Then, How); its text follows">
<title>Quick start: a table of 3 rows (Then, How); its text follows</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#B4BDCE}.i{fill:#E8ECF4}.m{fill:#8893A7}.b{font-weight:600;fill:#E8ECF4}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7AA2FF}.l{fill:#7AA2FF}</style>
<rect x="0.5" y="0.5" width="879" height="264" rx="12" fill="#131822" stroke="#FFFFFF" stroke-opacity=".12"/>
<path d="M0.5 40V12.5A12 12 0 0 1 12.5 0.5H867.5A12 12 0 0 1 879.5 12.5V40Z" fill="#10141C"/>
<line x1="0.5" y1="40" x2="879.5" y2="40" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="16" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em">THEN</text>
<text x="161.072" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em">HOW</text>
<text x="16" y="68" font-size="14" xml:space="preserve"><tspan class="b">Ask for</tspan></text>
<text x="16" y="89" font-size="14" xml:space="preserve"><tspan class="b">something</tspan></text>
<text x="161.1" y="68" font-size="14" xml:space="preserve"><tspan class="c">fix the login timeout on slow wifi</tspan>, in plain words. That&#x27;s the whole interface.</text>
<line x1="16" y1="108" x2="864" y2="108" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="136" font-size="14" xml:space="preserve"><tspan class="b">Watch it first</tspan></text>
<text x="161.1" y="136" font-size="14" xml:space="preserve"><tspan class="c">sampo demo</tspan> runs the real <tspan class="c">sampo</tspan> and Ward hook on a seeded bug in a throwaway repo: no model calls,</text>
<text x="161.1" y="157" font-size="14" xml:space="preserve">nothing left behind.</text>
<line x1="16" y1="176" x2="864" y2="176" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="204" font-size="14" xml:space="preserve"><tspan class="b">See where</tspan></text>
<text x="16" y="225" font-size="14" xml:space="preserve"><tspan class="b">things stand</tspan></text>
<text x="161.1" y="204" font-size="14" xml:space="preserve">Bare <tspan class="c">sampo</tspan> in a project says what&#x27;s next; <tspan class="c">sampo help</tspan> answers &quot;can it…?&quot; in plain words; <tspan class="c">sampo</tspan></text>
<text x="161.1" y="225" font-size="14" xml:space="preserve"><tspan class="c">which NEED</tspan> searches past fixes, your tools, MCP servers, binaries, skills and plugins at once, and</text>
<text x="161.1" y="246" font-size="14" xml:space="preserve">says which hits need a grant.</text>
</svg>
