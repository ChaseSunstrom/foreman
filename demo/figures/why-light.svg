<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 474" width="880" height="474" role="img" aria-label="Why: a table of 7 rows (Sampo, So that); its text follows">
<title>Why: a table of 7 rows (Sampo, So that); its text follows</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#3A4556}.i{fill:#0F1722}.m{fill:#5B6679}.b{font-weight:600;fill:#0F1722}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#2F62E0}.l{fill:#2F62E0}</style>
<rect x="0.5" y="0.5" width="879" height="473" rx="12" fill="#FFFFFF" stroke="#0F1722" stroke-opacity=".12"/>
<path d="M0.5 40V12.5A12 12 0 0 1 12.5 0.5H867.5A12 12 0 0 1 879.5 12.5V40Z" fill="#F6F7F9"/>
<line x1="0.5" y1="40" x2="879.5" y2="40" stroke="#0F1722" stroke-opacity=".12"/>
<text x="16" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em">SAMPO</text>
<text x="168.334" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em">SO THAT</text>
<text x="16" y="68" font-size="14" xml:space="preserve"><tspan class="b">Plans first</tspan></text>
<text x="168.3" y="68" font-size="14" xml:space="preserve">Every request becomes a brief before any edit: type, size, what &quot;done&quot; means and the command that</text>
<text x="168.3" y="89" font-size="14" xml:space="preserve">proves it. No task, no edit.</text>
<line x1="16" y1="108" x2="864" y2="108" stroke="#0F1722" stroke-opacity=".07"/>
<text x="16" y="136" font-size="14" xml:space="preserve"><tspan class="b">Proves it</tspan></text>
<text x="168.3" y="136" font-size="14" xml:space="preserve">Evidence is a command sampo ran and recorded, never a sentence. A fix needs a test that failed first.</text>
<text x="168.3" y="157" font-size="14" xml:space="preserve">Nothing closes without its audits.</text>
<line x1="16" y1="176" x2="864" y2="176" stroke="#0F1722" stroke-opacity=".07"/>
<text x="16" y="204" font-size="14" xml:space="preserve"><tspan class="b">Guards bypass</tspan></text>
<text x="16" y="225" font-size="14" xml:space="preserve"><tspan class="b">mode</tspan></text>
<text x="168.3" y="204" font-size="14" xml:space="preserve">A fail-closed Ward stops wide deletes, force-pushes, credential reads and <tspan class="c">curl | sh</tspan>, and saves</text>
<text x="168.3" y="225" font-size="14" xml:space="preserve">uncommitted work before git throws it away.</text>
<line x1="16" y1="244" x2="864" y2="244" stroke="#0F1722" stroke-opacity=".07"/>
<text x="16" y="272" font-size="14" xml:space="preserve"><tspan class="b">Stays on task</tspan></text>
<text x="168.3" y="272" font-size="14" xml:space="preserve">One active task. New ideas go to the inbox instead of being chased; <tspan class="c">NOW:</tspan> switches on purpose.</text>
<line x1="16" y1="291" x2="864" y2="291" stroke="#0F1722" stroke-opacity=".07"/>
<text x="16" y="319" font-size="14" xml:space="preserve"><tspan class="b">Never loses its</tspan></text>
<text x="16" y="340" font-size="14" xml:space="preserve"><tspan class="b">place</tspan></text>
<text x="168.3" y="319" font-size="14" xml:space="preserve">State lives on disk, so after <tspan class="c">/compact</tspan> or in a new session Claude resumes at the exact step. A revert</text>
<text x="168.3" y="340" font-size="14" xml:space="preserve">reopens the step it undid.</text>
<line x1="16" y1="359" x2="864" y2="359" stroke="#0F1722" stroke-opacity=".07"/>
<text x="16" y="387" font-size="14" xml:space="preserve"><tspan class="b">Keeps going</tspan></text>
<text x="168.3" y="387" font-size="14" xml:space="preserve">Drive mode works the whole queue, then finds its own next work. <tspan class="c">sampo run</tspan> and <tspan class="c">sampo serve</tspan> keep</text>
<text x="168.3" y="408" font-size="14" xml:space="preserve">it going headless.</text>
<line x1="16" y1="427" x2="864" y2="427" stroke="#0F1722" stroke-opacity=".07"/>
<text x="16" y="455" font-size="14" xml:space="preserve"><tspan class="b">Learns</tspan></text>
<text x="168.3" y="455" font-size="14" xml:space="preserve">Your corrections and Sampo&#x27;s own friction become lessons, tripwires and fixes.</text>
</svg>
