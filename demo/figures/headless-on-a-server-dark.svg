<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-label="Headless on a server: a table of 4 rows (`sampo serve`, `sampo run`); its text follows">
<title>Headless on a server: a table of 4 rows (`sampo serve`, `sampo run`); its text follows</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#B4BDCE}.i{fill:#E8ECF4}.m{fill:#8893A7}.b{font-weight:600;fill:#E8ECF4}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7AA2FF}.l{fill:#7AA2FF}</style>
<rect x="0.5" y="0.5" width="879" height="311" rx="12" fill="#131822" stroke="#FFFFFF" stroke-opacity=".12"/>
<path d="M0.5 40V12.5A12 12 0 0 1 12.5 0.5H867.5A12 12 0 0 1 879.5 12.5V40Z" fill="#10141C"/>
<line x1="0.5" y1="40" x2="879.5" y2="40" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="16" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em"></text>
<text x="128.264" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em">SAMPO SERVE</text>
<text x="508.708" y="25" font-size="11.5" class="m" font-weight="600" letter-spacing=".07em">SAMPO RUN</text>
<text x="16" y="68" font-size="14" xml:space="preserve"><tspan class="b">What</tspan></text>
<text x="128.3" y="68" font-size="14" xml:space="preserve">Claude Code Remote Control as a systemd user</text>
<text x="128.3" y="89" font-size="14" xml:space="preserve">unit</text>
<text x="508.7" y="68" font-size="14" xml:space="preserve">The queue in fresh <tspan class="c">claude -p</tspan> sessions, one task</text>
<text x="508.7" y="89" font-size="14" xml:space="preserve">each</text>
<line x1="16" y1="108" x2="864" y2="108" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="136" font-size="14" xml:space="preserve"><tspan class="b">Start</tspan></text>
<text x="128.3" y="136" font-size="14" xml:space="preserve">Ask Claude to &quot;serve this repo&quot; (one yes grants</text>
<text x="128.3" y="157" font-size="14" xml:space="preserve"><tspan class="c">remote</tspan>)</text>
<text x="508.7" y="136" font-size="14" xml:space="preserve"><tspan class="c">sampo run</tspan> (<tspan class="c">--max-usd</tspan> caps the spend)</text>
<line x1="16" y1="176" x2="864" y2="176" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="204" font-size="14" xml:space="preserve"><tspan class="b">You</tspan></text>
<text x="128.3" y="204" font-size="14" xml:space="preserve">Send requests from claude.ai/code or the Claude</text>
<text x="128.3" y="225" font-size="14" xml:space="preserve">app</text>
<text x="508.7" y="204" font-size="14" xml:space="preserve">Come back to closed tasks</text>
<line x1="16" y1="244" x2="864" y2="244" stroke="#FFFFFF" stroke-opacity=".07"/>
<text x="16" y="272" font-size="14" xml:space="preserve"><tspan class="b">When it</tspan></text>
<text x="16" y="293" font-size="14" xml:space="preserve"><tspan class="b">fails</tspan></text>
<text x="128.3" y="272" font-size="14" xml:space="preserve">Restarts; stops after five failed restarts in ten</text>
<text x="128.3" y="293" font-size="14" xml:space="preserve">minutes</text>
<text x="508.7" y="272" font-size="14" xml:space="preserve">Waits out a usage limit; blocks a stuck task with the</text>
<text x="508.7" y="293" font-size="14" xml:space="preserve">reason</text>
</svg>
